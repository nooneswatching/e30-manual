# Builds the manual site (OCR + parts catalogue) and publishes it to GitHub Pages.
#
# One-time setup: repository Settings -> Pages -> "Build and deployment" source = "GitHub Actions".
#
# OCR results are cached between runs keyed on the PDF contents (for Git LFS files the pointer
# file's hash is used), so a push that only changes code or parts data finishes in a minute, and
# a new PDF only OCRs its own pages.
name: Build and deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false   # pulled below only when the OCR cache misses

      - name: Restore OCR cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            build/cache
            site/data/manuals
            site/data/manuals.json
            site/data/search
          key: ocr-v1-${{ hashFiles('manuals/*.pdf', 'manuals/*.json', 'tools/build_manuals.py', 'tools/bmw_groups.py') }}
          restore-keys: |
            ocr-v1-

      - name: Pull Git LFS files
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          if grep -lq "git-lfs" manuals/*.pdf 2>/dev/null; then git lfs install && git lfs pull; fi

      - name: Install tesseract
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-eng

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: OCR manuals
        if: steps.cache.outputs.cache-hit != 'true'
        run: python tools/build_manuals.py --workers 4

      - name: Build parts catalogue
        run: python tools/build_parts.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
